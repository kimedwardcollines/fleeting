services:
  - type: web
    name: fleeting
    buildCommand: |
      python -m pip install -r requirements.txt
      python manage.py migrate --no-input
      python manage.py collectstatic --clear --no-input
    startCommand: gunicorn logistics_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        value: "postgres://default:mbIjZTsEtRvnm569hArA2CSW0WN5TjGE@dpg-d85jd6gg4nts7382nnm0-a/fleeting"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: ALLOWED_HOSTS
        value: "fleeting.onrender.com"